
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatGPT Clone</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #212121;
    color: white;
    display: flex;
    height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 260px;
    background: #171717;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 25px;
}

.new-chat {
    background: transparent;
    color: white;
    border: 1px solid #555;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    font-size: 15px;
}

.new-chat:hover {
    background: #303030;
}

.history-title {
    color: #999;
    font-size: 13px;
    margin-top: 30px;
    margin-bottom: 10px;
}

.history {
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

.history:hover {
    background: #303030;
}

.profile {
    margin-top: auto;
    padding: 12px;
    border-top: 1px solid #333;
}

/* Main Area */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
}

.topbar {
    padding: 20px;
    font-size: 17px;
    border-bottom: 1px solid #333;
}

.chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
}

.welcome {
    font-size: 30px;
    margin-bottom: 25px;
    text-align: center;
}

.messages {
    width: 100%;
    max-width: 750px;
}

.message {
    background: #303030;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
    line-height: 1.5;
}

/* Input Area */
.input-section {
    padding: 20px;
    display: flex;
    justify-content: center;
}

.input-box {
    width: 100%;
    max-width: 750px;
    background: #303030;
    border-radius: 25px;
    padding: 12px 15px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.input-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 16px;
    padding: 10px;
}

.send-btn {
    background: white;
    color: black;
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 20px;
    cursor: pointer;
}

.footer {
    text-align: center;
    color: #888;
    font-size: 12px;
    padding: 10px;
}

/* Mobile Responsive */
@media(max-width: 650px) {
    .sidebar {
        width: 115px;
        padding: 10px;
    }

    .logo {
        font-size: 17px;
    }

    .new-chat {
        font-size: 12px;
        padding: 8px;
    }

    .history {
        font-size: 11px;
        padding: 8px 2px;
    }

    .welcome {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<!-- Sidebar -->
<aside class="sidebar">

    <div class="logo">ChatGPT</div>

    <button class="new-chat" onclick="newChat()">
        + New Chat
    </button>

    <div class="history-title">Recent Chats</div>

    <div class="history">My First Chat</div>
    <div class="history">Website Ideas</div>
    <div class="history">Learning HTML</div>

    <div class="profile">
        👤 My Profile
    </div>

</aside>

<!-- Main Content -->
<main class="main">

    <div class="topbar">
        ChatGPT Clone
    </div>

    <section class="chat-area" id="chatArea">

        <h1 class="welcome" id="welcome">
            What can I help with?
        </h1>

        <div class="messages" id="messages"></div>

    </section>

    <!-- Message Input -->
    <div class="input-section">

        <div class="input-box">

            <input
                type="text"
                id="userInput"
                placeholder="Message ChatGPT..."
                onkeydown="if(event.key === 'Enter') sendMessage()"
            >

            <button class="send-btn" onclick="sendMessage()">
                ↑
            </button>

        </div>

    </div>

    <div class="footer">
        This is a non-functional ChatGPT UI clone.
    </div>

</main>

<script>

function sendMessage() {

    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");

    if(input.value.trim() === "") {
        return;
    }

    welcome.style.display = "none";

    const message = document.createElement("div");
    message.className = "message";
    message.textContent = input.value;

    messages.appendChild(message);

    input.value = "";

    const chatArea = document.getElementById("chatArea");
    chatArea.scrollTop = chatArea.scrollHeight;

}

function newChat() {

    document.getElementById("messages").innerHTML = "";
    document.getElementById("welcome").style.display = "block";
    document.getElementById("userInput").value = "";

}

</script>

</body>
</html>
